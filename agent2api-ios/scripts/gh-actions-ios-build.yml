# ── 无本地电脑方案：用 GitHub Actions 的 macOS runner 出两个产物 ──────────
# 放到你自己 fork 的仓库里：  .github/workflows/ios-build.yml
# 触发：网页上点 Run workflow（手机浏览器就能点），跑完下载 Artifacts：
#   agent2api-daemon  →  Mach-O 守护进程二进制（配合 daemon/*.plist）
#   Agent2API.ipa     →  纯客户端壳（EMBED=0，不含 Rust）
#
# 前提：仓库里同时放了本工程的 app/ 与 scripts/（即把 agent2api-ios/ 提交进仓库）。
# 只需改三处占位：UPSTREAM_REPO / 路径前缀（如放在 ios/ 子目录）/ 是否要 EMBED=1。
name: ios-build

on:
  workflow_dispatch:
    inputs:
      embed:
        description: "1 = 内嵌网关（需 Rust 静态库，IPA 变大）；0 = 纯客户端壳"
        default: "0"

env:
  UPSTREAM_REPO: aimod-cc/Agent2API
  UPSTREAM_REF: main
  IOS_PREFIX: agent2api-ios          # 本工程在仓库里的目录
  DEPLOY_TARGET: "15.0"

jobs:
  # ── 产物 1：Mach-O 守护进程（LaunchDaemon 用它）─────────────────────
  daemon:
    runs-on: macos-14
    steps:
      - name: 取上游源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: 装 Rust + iOS target
        run: |
          rustup target add aarch64-apple-ios
          rustc -Vv

      - name: 打 iOS 补丁（reqwest system-proxy / 子进程 cfg）
        working-directory: upstream/desktop-tauri/src-tauri/server
        run: |
          python3 - <<'PY'
          import re, pathlib
          # 1) reqwest: iOS 上关掉 system-proxy（system-configuration 在 iOS SDK 上易挂）
          p = pathlib.Path('Cargo.toml'); s = p.read_text()
          if 'target.\'cfg(target_os = "ios")\'.dependencies' not in s:
              s = s.replace(
                'reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "system-proxy"] }',
                'reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }')
              s += '\n[target.\'cfg(not(target_os = "ios"))\'.dependencies]\n'
              s += 'reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "system-proxy"] }\n'
              p.write_text(s)
          PY
          grep -n 'reqwest' Cargo.toml

      - name: 编守护进程（aarch64-apple-ios）
        working-directory: upstream/desktop-tauri/src-tauri
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ${{ env.DEPLOY_TARGET }}
        run: |
          cargo build -p agent2api-server --release --target aarch64-apple-ios
          file target/aarch64-apple-ios/release/agent2api-server
          mkdir -p ../../out && cp target/aarch64-apple-ios/release/agent2api-server ../../out/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: agent2api-daemon
          path: upstream/out/agent2api-server

  # ── 产物 2：IPA（纯客户端壳；EMBED=1 时先编静态库）──────────────────
  ipa:
    runs-on: macos-14
    steps:
      - name: 取本工程
        uses: actions/checkout@v4
        with:
          path: proj

      - name: 取上游源码（EMBED=1 才需要静态库）
        if: ${{ github.event.inputs.embed == '1' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: 装 Rust + iOS target
        if: ${{ github.event.inputs.embed == '1' }}
        run: rustup target add aarch64-apple-ios

      - name: 编 Rust 静态库
        if: ${{ github.event.inputs.embed == '1' }}
        working-directory: proj/${{ env.IOS_PREFIX }}/ios-ffi
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ${{ env.DEPLOY_TARGET }}
        run: |
          # Cargo.toml 里的 path 依赖指向 ../../Agent2API/...，CI 下改成实际位置
          sed -i '' "s|path = \"../../Agent2API/desktop-tauri/src-tauri/server\"|path = \"../../upstream/desktop-tauri/src-tauri/server\"|" Cargo.toml
          cargo build --release --target aarch64-apple-ios

      - name: 编 IPA
        working-directory: proj/${{ env.IOS_PREFIX }}
        env:
          EMBED: ${{ github.event.inputs.embed }}
          UI_SRC: ${{ github.workspace }}/ui     # 若要内嵌面板，先把 ui/ 放进仓库或从 artifact 取
        run: |
          brew install ldid || true
          chmod +x scripts/*.sh
          ./scripts/build-ipa.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Agent2API.ipa
          path: proj/${{ env.IOS_PREFIX }}/build/Agent2API.ipa
