# ── Aggregateapi · 全平台产物构建 ──────────────────────────────────────────
# 说明见根目录 README.md。
#   · 上游（aimod-cc/Agent2API）不 vendoring：构建时浅克隆 + 打本仓库的 patch；
#   · 每个 job 都是 continue-on-error：任意一端失败不阻断其它端出包；
#   · iOS 是主产物（默认 EMBED=1，网关跑在 App 进程内，装上即可用）。
name: build

on:
  workflow_dispatch:
    inputs:
      embed:
        description: "iOS: 1=内嵌网关(可独立运行) 0=纯客户端壳"
        default: "1"
      only:
        description: "只跑某端：all / ios / plugins / store / macos / windows / linux / android / web"
        default: "all"
      publish:
        description: "true = 构建完自动发布到 Releases（IPA + 两个插件 zip）"
        default: "false"
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  UPSTREAM_REPO: https://github.com/aimod-cc/Agent2API.git
  IOS_DEPLOY: "15.0"

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # 1. iOS：网关 Mach-O 守护进程 + 可直接安装的 IPA
  # ══════════════════════════════════════════════════════════════════════
  ios:
    name: iOS (daemon + IPA)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'ios' || inputs.only == 'store' }}
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 取上游源码
        run: |
          set -euo pipefail
          git clone --depth 64 "$UPSTREAM_REPO" Agent2API
          # 对齐"官方最新发布"而不是 main 的浮动头：拉 tag 并切到最新 v* 版本。
          # main 上可能有未发布的提交，官方 release 一定对应某个 tag。
          git -C Agent2API fetch --tags --depth 64 >/dev/null 2>&1 || true
          TAG="$(git -C Agent2API tag -l 'v*' --sort=-v:refname | head -1)"
          if [ -n "$TAG" ]; then
            if git -C Agent2API fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1 \
               && git -C Agent2API checkout -q "refs/tags/$TAG" 2>/dev/null; then
              echo "== 上游版本：$TAG（$(git -C Agent2API rev-parse --short HEAD)）"
            else
              echo "== 拉取 tag $TAG 失败，继续用 main：$(git -C Agent2API rev-parse --short HEAD)"
            fi
          else
            echo "== 上游无 v* 标签，使用 main：$(git -C Agent2API rev-parse --short HEAD)"
          fi
          git -C Agent2API log -1 --format='   %h %ad %s' --date=short

      - name: 打补丁（插件宿主闸门 + 能力表端点）
        run: |
          set -euo pipefail
          for p in agent2api-universal/patches/*.diff; do
            echo "== apply $p"
            if ! git -C Agent2API apply --3way "$(pwd)/$p"; then
              echo "❌ 补丁未应用：$p（上游已变，需要重新生成这个补丁）"
              exit 1
            fi
            echo "   ✅ 已应用"
          done
          # 复核关键改动确实落地（不靠"看起来成功"）
          grep -R "vbox-Ai/Aggregateapi" Agent2API/desktop-tauri/src-tauri/server/src | head -5
          echo "== C 方案：插件进程改为 daemon 自身 --serve-pack"
          python3 scripts/patch-inproc.py Agent2API || echo "WARN: inproc 补丁未应用"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            Agent2API/desktop-tauri/src-tauri -> target
            agent2api-ios/ios-ffi -> target

      - name: 编内嵌 provider 静态库（C 方案）
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ProvidersPlugin/Agent2Providers.git plugins-src
          python3 scripts/patch-plugin-cargo.py plugins-src
          chmod +x scripts/*.sh
          bash scripts/build-pack-host.sh plugins-src out/packlib
          ls -lh out/packlib/libpack_host.a

      # 守护进程：用我们自己的 bin 目标（上游已删 headless bin）
      - name: 编网关守护进程（Mach-O，launchd 用）
        working-directory: agent2api-ios/ios-ffi
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ${{ env.IOS_DEPLOY }}
          A2A_PACK_LIB_DIR: ${{ github.workspace }}/out/packlib
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-apple-ios --features pack_host --bin agent2api-daemon
          BIN=target/aarch64-apple-ios/release/agent2api-daemon
          file "$BIN"
          mkdir -p "$GITHUB_WORKSPACE/out/ios"
          # 保持与 LaunchDaemon plist 里的路径/文件名一致
          cp "$BIN" "$GITHUB_WORKSPACE/out/ios/agent2api-server"

      - name: 编 iOS 静态库（供 EMBED=1 的 IPA 使用）
        continue-on-error: true
        working-directory: agent2api-ios/ios-ffi
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ${{ env.IOS_DEPLOY }}
        run: |
          set +e
          cargo build --release --target aarch64-apple-ios
          ls -la target/aarch64-apple-ios/release/*.a 2>/dev/null || echo "WARN: 静态库未产出"
          exit 0

      - name: 打 IPA + 打包 deb（rootless / rootful 两版）
        env:
          EMBED_INPUT: ${{ inputs.embed || '1' }}
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
          SRC: ${{ github.workspace }}/Agent2API
          UI_SRC: ${{ github.workspace }}/Agent2API/desktop-tauri/ui
        run: |
          set -euo pipefail
          brew install ldid dpkg >/dev/null 2>&1 || true
          chmod +x agent2api-ios/scripts/*.sh
          mkdir -p "$GITHUB_WORKSPACE/out/ios"
          # plist 必须在 deb 打包之前就位（deb 要把 plist 一起装进去）
          cp agent2api-ios/daemon/*.plist "$GITHUB_WORKSPACE/out/ios/" || true

          # ① 客户端壳（EMBED=0）：panel-only，配 daemon
          echo "=== 客户端壳 ==="
          EMBED=0 ./agent2api-ios/scripts/build-ipa.sh
          cp agent2api-ios/build/Agent2API.ipa "$GITHUB_WORKSPACE/out/ios/Agent2API-client.ipa"

          # ② 独立版（EMBED=1）：网关内嵌，无需 daemon（插件不可用）
          LIB=agent2api-ios/ios-ffi/target/aarch64-apple-ios/release/libagent2api_ios.a
          if [ -f "$LIB" ]; then
            echo "=== 独立版 ==="
            EMBED=1 ./agent2api-ios/scripts/build-ipa.sh
            cp agent2api-ios/build/Agent2API.ipa "$GITHUB_WORKSPACE/out/ios/Agent2API-standalone.ipa"
          fi

          # ③ deb 用客户端壳重建一次（保证只有面板，不抢 3065）
          echo "=== deb 用客户端壳 ==="
          EMBED=0 ENTITLEMENTS="$GITHUB_WORKSPACE/agent2api-ios/app/Agent2API/entitlements-platform.plist" \
            ./agent2api-ios/scripts/build-ipa.sh

          if command -v dpkg-deb >/dev/null 2>&1; then
            VER=$(python3 -c "import json;v=json.load(open('plugins/agent2api-providers.json'))['version'];print('.'.join(v.split('.')[:2]))")
            STAMP="${BUILD_NUMBER:-$(date +%y%m%d%H%M)}"
            STAMP_VER="${VER}.${STAMP}"
            for PREFIX in "/var/jb" ""; do
              echo "=== 打包 deb（prefix='${PREFIX}'）==="
              bash -x scripts/build-allinone-deb.sh \
                --app agent2api-ios/build/Payload/Agent2API.app \
                --binary "$GITHUB_WORKSPACE/out/ios/agent2api-server" \
                --plist "$GITHUB_WORKSPACE/out/ios/com.chiyu.agent2api.plist" \
                --ui Agent2API/desktop-tauri/ui \
                --entitlements agent2api-ios/app/Agent2API/entitlements-platform.plist \
                --daemon-entitlements agent2api-ios/app/Agent2API/plugin-entitlements.plist \
                --prefix "$PREFIX" \
                --version "$STAMP_VER" --out "$GITHUB_WORKSPACE/out/ios"
            done
          else
            echo "WARN: 没有 dpkg-deb，跳过 deb"
          fi

          cp agent2api-ios/daemon/*.plist "$GITHUB_WORKSPACE/out/ios/" || true
          ls -lh "$GITHUB_WORKSPACE/out/ios"

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/ios/**
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 1.5 插件 · iOS 原生包（两个插件编成 Mach-O，打成网关认的 pack zip）
  # ══════════════════════════════════════════════════════════════════════
  plugins:
    name: Plugins (iOS packs)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'plugins' || inputs.only == 'store' }}
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 取插件源码
        run: git clone --depth 1 https://github.com/ProvidersPlugin/Agent2Providers.git plugins-src

      - name: 关掉 reqwest 的 system-proxy（iOS SDK 编不过）
        run: python3 scripts/patch-plugin-cargo.py plugins-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: plugins-src -> target


      - name: 编提供商增强包（全特性）
        working-directory: plugins-src
        run: |
          set -euo pipefail
          cargo build -p agent2api-providers --release --target aarch64-apple-ios
          cp target/aarch64-apple-ios/release/agent2api-providers \
             "$GITHUB_WORKSPACE/out/plugins/agent2api-providers"

      - name: 签名（AMFI 要求）
        run: |
          brew install ldid || true
          for b in out/plugins/agent2api-providers; do
            ldid -S"$GITHUB_WORKSPACE/agent2api-ios/app/Agent2API/plugin-entitlements.plist" "$b" || echo "WARN: ldid 失败 $b"
            file "$b"
          done

      - name: 下载官方骨架包
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch-official-packs.py --prefix agent2api-providers --out .cache/official
          ls -lh .cache/official

      - name: 打 iOS 插件包
        run: |
          set -euo pipefail
          mkdir -p out/packs
          OFF_M=$(ls .cache/official/agent2api-providers-*.zip | head -1)
          bash scripts/pack-ios-plugins.sh \
            --official "$OFF_M" --binary out/plugins/agent2api-providers \
            --id agent2api-providers --version "$(python3 -c "import json;print(json.load(open('plugins/agent2api-providers.json'))['version'])")" --out out/packs
          ls -lh out/packs

      - name: 上传插件产物
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: out/packs/**
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 2. macOS：dmg（Tauri 2，universal）
  # ══════════════════════════════════════════════════════════════════════
  macos:
    name: macOS (dmg)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'macos' }}
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 "$UPSTREAM_REPO" Agent2API
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Agent2API/desktop-tauri/src-tauri -> target
      - run: cargo install tauri-cli --version "^2" --locked
      - name: 打 dmg
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo tauri build --target universal-apple-darwin
      - name: 常驻二进制
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo build -p agent2api-server --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Agent2API/desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            Agent2API/desktop-tauri/src-tauri/target/release/agent2api-server
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 3. Windows：msi + exe
  # ══════════════════════════════════════════════════════════════════════
  windows:
    name: Windows (msi/exe)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'windows' }}
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 $env:UPSTREAM_REPO Agent2API
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Agent2API/desktop-tauri/src-tauri -> target
      - run: cargo install tauri-cli --version "^2" --locked
      - name: 打 msi/exe
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Agent2API/desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
            Agent2API/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 4. Linux：AppImage + deb + headless 二进制
  # ══════════════════════════════════════════════════════════════════════
  linux:
    name: Linux (AppImage/deb)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'linux' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 "$UPSTREAM_REPO" Agent2API
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential pkg-config file
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Agent2API/desktop-tauri/src-tauri -> target
      - run: cargo install tauri-cli --version "^2" --locked
      - name: 打 AppImage/deb
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo tauri build
      - name: headless 二进制
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo build -p agent2api-server --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Agent2API/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            Agent2API/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            Agent2API/desktop-tauri/src-tauri/target/release/agent2api-server
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 5. Android · KernelSU 模块 zip
  #    输出模块作者编译并真机验证过的原版包（glibc 二进制 + 插件 android-bin）。
  #    用上游源码重编 bionic 二进制的步骤留给 scripts/build-android-ksu.sh
  #    （本地可选执行），CI 不做，避免把 Android 失败耦合进流水线。
  # ══════════════════════════════════════════════════════════════════════
  android-ksu:
    name: Android (KSU zip)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 输出模块包
        run: |
          mkdir -p out/android
          cp assets/agent2api-ksu-module.zip out/android/
          ls -lh out/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-ksu
          path: out/android/**
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 6. Web / Docker：六端里"零壳"的那一端（自托管面板 + PWA）
  # ══════════════════════════════════════════════════════════════════════
  web:
    name: Web (docker + 面板)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'web' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 "$UPSTREAM_REPO" Agent2API
      - name: 注入宿主能力层到面板
        run: |
          cp agent2api-universal/ui/host.js Agent2API/desktop-tauri/ui/host.js
          for f in Agent2API/desktop-tauri/ui/index.html Agent2API/desktop-tauri/ui/m.html; do
            if [ -f "$f" ] && ! grep -q 'host.js' "$f"; then
              sed -i 's|</head>|  <script src="host.js"></script>\n</head>|' "$f"
            fi
          done
      - name: 打镜像
        run: docker build -t agent2api:ci Agent2API
      - name: 导出
        run: |
          mkdir -p out/web
          docker save agent2api:ci | gzip > out/web/agent2api-image.tar.gz
          tar -C Agent2API/desktop-tauri -czf out/web/agent2api-ui.tar.gz ui
          ls -lh out/web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/web/**
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 7. 发布到 Releases（IPA + daemon + 两个插件 zip，一次点完直接下载）
  #    触发：workflow_dispatch 勾 publish=true（建议 only=store）
  #    发布两个 tag（与插件 manifest 的 tag 规则一致）：
  #      v{version}      → Agent2API.ipa + agent2api-server + plist + 主插件包
  #      web-v{version}  → 网页插件包
  # ══════════════════════════════════════════════════════════════════════
  release:
    name: Publish Release
    needs: [ios, plugins]
    if: ${{ always() && inputs.publish == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 发布说明里要跑 git log，需要完整历史

      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 归类文件
        run: |
          set -euo pipefail
          mkdir -p dist/app dist/main dist/web

          # 只发布三样东西，避免用户分不清：
          #   ① all-in-one deb（App + 网关 + 面板资源）—— 用户只需装这一个
          #   ② 两个插件 zip —— 由面板内下载，不用手动装
          find artifacts -name '*.deb' -exec cp -v {} dist/app/ \;
          find artifacts -name 'agent2api-providers-*.zip' -exec cp -v {} dist/app/ \;
          find artifacts -name 'agent2api-web-providers-*.zip' -exec cp -v {} dist/app/ \;

          cp dist/app/agent2api-providers-*.zip dist/main/ 2>/dev/null || true
          cp dist/app/agent2api-web-providers-*.zip dist/web/ 2>/dev/null || true

          echo "--- 将发布到快照的资产 ---"; ls -lh dist/app
          test -n "$(ls -A dist/app)" || { echo "dist/app 为空：ios 产物没取到"; exit 1; }

      - name: 读取版本号与构建号
        id: ver
        run: |
          set -euo pipefail
          M=$(python3 -c "import json;print(json.load(open('plugins/agent2api-providers.json'))['version'])")
          W=$(python3 -c "import json;print(json.load(open('plugins/agent2api-web-providers.json'))['version'])")
          STAMP=$(date -u +%Y%m%d)
          echo "main=${M}" >> "$GITHUB_OUTPUT"
          echo "web=${W}" >> "$GITHUB_OUTPUT"
          echo "app_tag=ios-${STAMP}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "主包 ${M} / 网页包 ${W} / 应用快照 ios-${STAMP}-b${{ github.run_number }}"

      - name: 生成发布说明
        run: |
          set -euo pipefail
          {
            echo "## 构建信息"
            echo ""
            echo "- 构建号：\`${{ github.run_number }}\`"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 插件版本：providers \`${{ steps.ver.outputs.main }}\` / web \`${{ steps.ver.outputs.web }}\`"
            echo ""
            echo "## 本次包含"
            echo ""
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| \`Agent2API-standalone.ipa\` | 网关内嵌 + 去沙盒：装完即用，插件可在 App 内执行 |"
            echo "| \`Agent2API.ipa\` | 纯客户端壳：配 LaunchDaemon 使用（0.13 MB） |"
            echo "| \`ios-daemon-kit.zip\` | daemon + plist + 一键安装脚本 |"
            echo "| \`agent2api-providers-*.zip\` | 提供商增强插件（iOS 原生） |"
            echo "| \`agent2api-web-providers-*.zip\` | 网页提供商插件（iOS 原生） |"
            echo ""
            echo "## 最近的提交"
            echo ""
            git log -8 --pretty='- `%h` %s (%an, %ad)' --date=short
          } > notes.md
          cat notes.md

      # ── ① 应用快照：每次构建一个全新 tag，历史版本永久保留（你要的"能看到旧版本"）
      - name: 发布应用快照（新 tag，保留历史）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.app_tag }}
          name: Agent2API iOS ${{ steps.ver.outputs.main }} · build ${{ github.run_number }}
          body_path: notes.md
          files: dist/app/*
          fail_on_unmatched_files: false
          make_latest: true

      # ── ② 插件稳定通道：tag 固定（网关按 v{版本} 查找），覆盖更新
      - name: 发布插件稳定通道（providers）
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.main }}
          name: Agent2API providers v${{ steps.ver.outputs.main }}（插件通道）
          body: |
            这是**插件稳定通道**：网关按 `v{版本}` 查这个 tag 来下载插件包。
            每次构建会覆盖资产，历史版本请看 `ios-*` 开头的应用快照。
          files: dist/main/*
          fail_on_unmatched_files: false
          overwrite: true
          make_latest: false

      - name: 发布插件稳定通道（web）
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-v${{ steps.ver.outputs.web }}
          name: Agent2API web-providers v${{ steps.ver.outputs.web }}（插件通道）
          body: |
            网页插件稳定通道（网关据此下载）。历史版本见 `ios-*` 应用快照。
          files: dist/web/*
          fail_on_unmatched_files: false
          overwrite: true
          make_latest: false
