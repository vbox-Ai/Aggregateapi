# ── Aggregateapi · 全平台产物构建 ──────────────────────────────────────────
# 说明见根目录 README.md。
#   · 上游（aimod-cc/Agent2API）不 vendoring：构建时浅克隆 + 打本仓库的 patch；
#   · 每个 job 都是 continue-on-error：任意一端失败不阻断其它端出包；
#   · iOS 是主产物（默认 EMBED=1，网关跑在 App 进程内，装上即可用）。
name: build

on:
  workflow_dispatch:
    inputs:
      embed:
        description: "iOS: 1=内嵌网关(可独立运行) 0=纯客户端壳"
        default: "1"
      only:
        description: "只跑某端：all / ios / plugins / store / macos / windows / linux / android / web"
        default: "all"
      publish:
        description: "true = 构建完自动发布到 Releases（IPA + 两个插件 zip）"
        default: "false"
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  UPSTREAM_REPO: https://github.com/aimod-cc/Agent2API.git
  IOS_DEPLOY: "15.0"

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # 1. iOS：网关 Mach-O 守护进程 + 可直接安装的 IPA
  # ══════════════════════════════════════════════════════════════════════
  ios:
    name: iOS (daemon + IPA)
    # always() 是必需的：`needs` 里任何作业失败/被取消，默认会让本作业 skipped。
    # run #157 就是这么丢掉 iOS 的（Plugins 在 1 秒内被 cancelled → iOS skipped，
    # 一只 deb 都没出）。插件包只是"锦上添花"，拿不到就出不带预置插件的 deb。
    if: ${{ always() && (!inputs.only || inputs.only == 'all' || inputs.only == 'ios' || inputs.only == 'store') }}
    runs-on: macos-15
    continue-on-error: true
    # deb 里要预置插件包，所以先等插件作业出包（它的产物下载是尽力而为）
    needs: [plugins]
    steps:
      - uses: actions/checkout@v4

      - name: 取上游源码
        run: |
          set -euo pipefail
          # GitHub 偶发连接重置：直连失败就换镜像（用户提供）
          clone_upstream() {
            local repo="$1" dir="$2" depth="${3:-64}"
            for base in "" "https://ghfast.top/" "https://gh-proxy.com/"; do
              rm -rf "$dir"
              if git clone --depth "$depth" "${base}${repo}" "$dir" 2>&1 | tail -2; then
                if [ -d "$dir/.git" ]; then
                  echo "   clone ok: ${base:-直连}"
                  return 0
                fi
              fi
              echo "   clone 失败，换下一个源：${base:-直连}"
            done
            echo "❌ 所有源都克隆失败：$repo"
            return 1
          }
          clone_upstream "$UPSTREAM_REPO" Agent2API 64
          # 对齐"官方最新发布"而不是 main 的浮动头：拉 tag 并切到最新 v* 版本。
          # main 上可能有未发布的提交，官方 release 一定对应某个 tag。
          git -C Agent2API fetch --tags --depth 64 >/dev/null 2>&1 || true
          TAG="$(git -C Agent2API tag -l 'v*' --sort=-v:refname | head -1)"
          if [ -n "$TAG" ]; then
            if git -C Agent2API fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1 \
               && git -C Agent2API checkout -q "refs/tags/$TAG" 2>/dev/null; then
              echo "== 上游版本：${TAG}（$(git -C Agent2API rev-parse --short HEAD)）"
            else
              echo "== 拉取 tag $TAG 失败，继续用 main：$(git -C Agent2API rev-parse --short HEAD)"
            fi
          else
            echo "== 上游无 v* 标签，使用 main：$(git -C Agent2API rev-parse --short HEAD)"
          fi
          git -C Agent2API log -1 --format='   %h %ad %s' --date=short

      - name: 打补丁（插件宿主闸门 + 能力表端点）
        run: |
          set -euo pipefail
          for p in agent2api-universal/patches/*.diff; do
            echo "== apply $p"
            if ! git -C Agent2API apply --3way "$(pwd)/$p"; then
              echo "❌ 补丁未应用：${p}（上游已变，需要重新生成这个补丁）"
              exit 1
            fi
            echo "   ✅ 已应用"
          done
          # 复核关键改动确实落地（不靠"看起来成功"）
          grep -R "vbox-Ai/Aggregateapi" Agent2API/desktop-tauri/src-tauri/server/src | head -5
          echo "== C 方案：插件进程改为 daemon 自身 --serve-pack"
          python3 scripts/patch-inproc.py Agent2API || echo "WARN: inproc 补丁未应用"

      # deb 里预置的插件包版本必须 >= 网关版本，否则网关拒绝加载/安装。
      - name: 对齐插件版本（>= 网关版本）
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs "$UPSTREAM_REPO" 'v*' \
                | sed 's#.*refs/tags/##' \
                | python3 scripts/latest-tag.py || true)
          echo "上游最新 tag：${TAG:-（未取到）}"
          python3 scripts/align-plugin-version.py --min-version "${TAG:-v0.0.0}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            Agent2API/desktop-tauri/src-tauri -> target
            agent2api-ios/ios-ffi -> target

      - name: 编内嵌 provider 静态库（C 方案）
        run: |
          set -euo pipefail
          for base in "" "https://ghfast.top/" "https://gh-proxy.com/"; do
            rm -rf plugins-src
            if git clone --depth 1 "${base}https://github.com/ProvidersPlugin/Agent2Providers.git" plugins-src 2>&1 | tail -1 && [ -d plugins-src/.git ]; then
              echo "   plugins-src ok: ${base:-直连}"; break
            fi
          done
          python3 scripts/patch-plugin-cargo.py plugins-src
          chmod +x scripts/*.sh
          bash scripts/build-pack-host.sh plugins-src out/packlib
          ls -lh out/packlib/pack_host/target/aarch64-apple-ios/release/libpack_host.rlib
          ls -d out/packlib/pack_host   # daemon 的 path 依赖要能找到这个 crate

      # 守护进程：用我们自己的 bin 目标（上游已删 headless bin）
      - name: 编网关守护进程（Mach-O，launchd 用）
        working-directory: agent2api-ios/ios-ffi
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ${{ env.IOS_DEPLOY }}
          A2A_PACK_LIB_DIR: ${{ github.workspace }}/out/packlib
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-apple-ios --features pack_host --bin agent2api-daemon
          cargo build --release --target aarch64-apple-ios --bin agent2api-supervisor
          BIN=target/aarch64-apple-ios/release/agent2api-daemon
          SUP=target/aarch64-apple-ios/release/agent2api-supervisor
          file "$BIN" "$SUP"
          mkdir -p "$GITHUB_WORKSPACE/out/ios"
          # 保持与 LaunchDaemon plist 里的路径/文件名一致
          cp "$BIN" "$GITHUB_WORKSPACE/out/ios/agent2api-server"
          cp "$SUP" "$GITHUB_WORKSPACE/out/ios/agent2api-supervisor"

      - name: 编 iOS 静态库（供 EMBED=1 的 IPA 使用）
        continue-on-error: true
        working-directory: agent2api-ios/ios-ffi
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ${{ env.IOS_DEPLOY }}
        run: |
          set +e
          cargo build --release --target aarch64-apple-ios
          ls -la target/aarch64-apple-ios/release/*.a 2>/dev/null || echo "WARN: 静态库未产出"
          exit 0

      - name: 取回插件包（预置进 deb）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: plugins
          path: out/packs

      - name: 摊开插件目录（deb 预置用）
        run: |
          set -euo pipefail
          if compgen -G "out/packs/*.zip" > /dev/null; then
            python3 scripts/stage-plugin-packs.py --out out/stage-packs out/packs/*.zip
          else
            echo "WARN: 没取到插件包，这次 deb 不带预置插件"
          fi

      - name: 校验 shell 脚本（编码 + 语法）
        run: |
          set -euo pipefail
          fail=0
          for f in $(git ls-files '*.sh'); do
            # ① UTF-8 BOM 会让 `#!/bin/bash` 变成 `\ufeff#!/bin/bash`，
            #    内核对它认不出 shebang，脚本根本跑不起来。
            if head -c 3 "$f" | od -An -tx1 | tr -d ' \n' | grep -qi '^efbbbf'; then
              echo "::error file=$f::带 UTF-8 BOM，会让 #!/bin/bash 失效"
              fail=1
            fi
            # ② 语法检查：中文注释被按错误编码往返一次就会破坏引号配平，
            #    这种损坏在 bash -n 面前立刻现形（比等到打包时便宜得多）。
            if ! bash -n "$f" 2>/tmp/a2a-synerr; then
              echo "::error file=$f::bash 语法检查失败：$(head -1 /tmp/a2a-synerr)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "shell 脚本编码与语法校验通过"

      - name: 校验手机端自洽（图标 / i18n 参数 / 跳转 / 端点拼写）
        run: |
          set -euo pipefail
          # 这四类问题 TypeScript 一个都不拦：图标名写错渲染成空白、t() 少传参数会
          # 原样显示 {count}、跳转目标不存在会静默回首页、端点拼错只在运行时 404。
          python3 scripts/check-mobile-ui.py

      - name: 构建手机面板 UI（从源码，覆盖上游预编译产物）
        run: |
          set -euo pipefail
          echo "=== 安装手机工程依赖 ==="
          ( cd desktop-tauri/mobile && npm ci )
          # ui-kit 以**源码**接入（tsconfig paths 指向 ../ui-kit/src），它自己的依赖
          # 必须在 ui-kit/node_modules 里 —— 少了这些包，tsc 会在
          # ../ui-kit/src/*.tsx 报 TS2307，vite 会在 ui-kit/styles/*.css 报
          # Can't resolve 'tw-animate-css' / 'shadcn/tailwind.css'。
          # 本机开发时这份 node_modules 一直在，所以本地能过、CI 过不了。
          echo "=== 安装 ui-kit 依赖（组件库以源码接入，需要它自己的 node_modules）==="
          ( cd desktop-tauri/ui-kit && npm install --no-audit --no-fund )

          echo "=== 构建手机面板 UI ==="
          ( cd desktop-tauri/mobile && npm run build )
          # 产物落到 desktop-tauri/ui/m；把它放进上游 checkout，
          # 这样 deb / IPA 打包的 --ui 用的就是我们新编的 mobile.js
          rm -rf Agent2API/desktop-tauri/ui/m
          cp -R desktop-tauri/ui/m Agent2API/desktop-tauri/ui/m
          if [ -f desktop-tauri/ui/sw.js ]; then
            cp desktop-tauri/ui/sw.js Agent2API/desktop-tauri/ui/sw.js
          fi
          echo "==> UI 产物："
          ls -lh desktop-tauri/ui/m

      - name: 打 IPA + 打包 deb（rootless / rootful 两版）
        env:
          EMBED_INPUT: ${{ inputs.embed || '1' }}
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
          SRC: ${{ github.workspace }}/Agent2API
          UI_SRC: ${{ github.workspace }}/Agent2API/desktop-tauri/ui
        run: |
          set -euo pipefail
          brew install ldid dpkg >/dev/null 2>&1 || true
          chmod +x agent2api-ios/scripts/*.sh
          mkdir -p "$GITHUB_WORKSPACE/out/ios"
          # plist 必须在 deb 打包之前就位（deb 要把 plist 一起装进去）
          cp agent2api-ios/daemon/*.plist "$GITHUB_WORKSPACE/out/ios/" || true

          # ① 客户端壳（EMBED=0）：panel-only，配 daemon
          echo "=== 客户端壳 ==="
          EMBED=0 ./agent2api-ios/scripts/build-ipa.sh
          cp agent2api-ios/build/Agent2API.ipa "$GITHUB_WORKSPACE/out/ios/Agent2API-client.ipa"

          # ② 独立版（EMBED=1）：网关内嵌，无需 daemon（插件不可用）
          LIB=agent2api-ios/ios-ffi/target/aarch64-apple-ios/release/libagent2api_ios.a
          if [ -f "$LIB" ]; then
            echo "=== 独立版 ==="
            EMBED=1 ./agent2api-ios/scripts/build-ipa.sh
            cp agent2api-ios/build/Agent2API.ipa "$GITHUB_WORKSPACE/out/ios/Agent2API-standalone.ipa"
          fi

          # ③ deb 用客户端壳重建一次（保证只有面板，不抢 3065）
          echo "=== deb 用客户端壳 ==="
          EMBED=0 ENTITLEMENTS="$GITHUB_WORKSPACE/agent2api-ios/app/Agent2API/entitlements-platform.plist" \
            ./agent2api-ios/scripts/build-ipa.sh

          if command -v dpkg-deb >/dev/null 2>&1; then
            VER=$(python3 -c "import json;v=json.load(open('plugins/agent2api-providers.json'))['version'];print('.'.join(v.split('.')[:2]))")
            STAMP="${BUILD_NUMBER:-$(date +%y%m%d%H%M)}"
            STAMP_VER="${VER}.${STAMP}"
            for PREFIX in "/var/jb" ""; do
              echo "=== 打包 deb（prefix='${PREFIX}'）==="
              bash -x scripts/build-allinone-deb.sh \
                --app agent2api-ios/build/Payload/Agent2API.app \
                --binary "$GITHUB_WORKSPACE/out/ios/agent2api-server" \
                --supervisor "$GITHUB_WORKSPACE/out/ios/agent2api-supervisor" \
                --plist "$GITHUB_WORKSPACE/out/ios/com.chiyu.agent2api.plist" \
                --ui Agent2API/desktop-tauri/ui \
                --entitlements agent2api-ios/app/Agent2API/entitlements-platform.plist \
                --daemon-entitlements agent2api-ios/app/Agent2API/plugin-entitlements.plist \
                --packs "$GITHUB_WORKSPACE/out/stage-packs" \
                --prefix "$PREFIX" \
                --arch both \
                --version "$STAMP_VER" --out "$GITHUB_WORKSPACE/out/ios"
            done
          else
            echo "WARN: 没有 dpkg-deb，跳过 deb"
          fi

          cp agent2api-ios/daemon/*.plist "$GITHUB_WORKSPACE/out/ios/" || true
          ls -lh "$GITHUB_WORKSPACE/out/ios"

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/ios/**
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 1.5 插件 · iOS 原生包（两个插件编成 Mach-O，打成网关认的 pack zip）
  # ══════════════════════════════════════════════════════════════════════
  plugins:
    name: Plugins (iOS packs)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'plugins' || inputs.only == 'store' }}
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 取插件源码
        run: |
          set -euo pipefail
          # GitHub 偶发连接重置：直连失败就换镜像（用户提供）
          clone_upstream() {
            local repo="$1" dir="$2" depth="${3:-64}"
            for base in "" "https://ghfast.top/" "https://gh-proxy.com/"; do
              rm -rf "$dir"
              if git clone --depth "$depth" "${base}${repo}" "$dir" 2>&1 | tail -2; then
                if [ -d "$dir/.git" ]; then
                  echo "   clone ok: ${base:-直连}"
                  return 0
                fi
              fi
              echo "   clone 失败，换下一个源：${base:-直连}"
            done
            echo "❌ 所有源都克隆失败：$repo"
            return 1
          }
          clone_upstream https://github.com/ProvidersPlugin/Agent2Providers.git plugins-src 1


      - name: 关掉 reqwest 的 system-proxy（iOS SDK 编不过）
        run: python3 scripts/patch-plugin-cargo.py plugins-src

      # 插件包版本必须 >= 网关自身版本，否则网关连加载带安装一起拒
      # （面板：「需要补齐插件」「已加载 0 家」）。下限取上游最新 v* tag。
      - name: 对齐插件版本（>= 网关版本）
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs "$UPSTREAM_REPO" 'v*' \
                | sed 's#.*refs/tags/##' \
                | python3 scripts/latest-tag.py || true)
          echo "上游最新 tag：${TAG:-（未取到）}"
          python3 scripts/align-plugin-version.py --min-version "${TAG:-v0.0.0}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: plugins-src -> target


      - name: 编提供商增强包（全特性）
        working-directory: plugins-src
        run: |
          set -euo pipefail
          cargo build -p agent2api-providers --release --target aarch64-apple-ios
          mkdir -p "$GITHUB_WORKSPACE/out/plugins"
          cp target/aarch64-apple-ios/release/agent2api-providers \
             "$GITHUB_WORKSPACE/out/plugins/agent2api-providers"

      - name: 签名（AMFI 要求）
        run: |
          brew install ldid || true
          for b in out/plugins/agent2api-providers; do
            ldid -S"$GITHUB_WORKSPACE/agent2api-ios/app/Agent2API/plugin-entitlements.plist" "$b" || echo "WARN: ldid 失败 $b"
            file "$b"
          done

      - name: 缓存官方骨架包
        uses: actions/cache@v4
        with:
          # 骨架包基本不变，而它的 CDN 会整段 504（实测直连与两个加速源同时失败）。
          # 缓存住「成功下载的那一次」，上游抽风时仍能出带预置包的 deb。
          path: .cache/official
          key: official-packs-v1-${{ runner.os }}

      - name: 下载官方骨架包
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `--optional`：官方骨架包只是「省得手写 pack.json」的优化，不是必需品。
          # 拉不到时（实测 CDN 会持续 504，脚本已带加速源回退）只警告、不中断 ——
          # 否则主包骨架失败会连带跳过后面**网页包**的打包步骤，白丢一批能出的包。
          if python3 scripts/fetch-official-packs.py --prefix agent2api-providers --out .cache/official --optional; then
            ls -lh .cache/official
            echo "SKELETON=ok" >> "$GITHUB_ENV"
          else
            echo "::warning::没取到官方骨架包，本次不带预置插件包"
            echo "SKELETON=missing" >> "$GITHUB_ENV"
          fi

      - name: 打 iOS 插件包
        if: env.SKELETON == 'ok'
        run: |
          set -euo pipefail
          mkdir -p out/packs
          OFF_M=$(ls .cache/official/agent2api-providers-*.zip | head -1)
          bash scripts/pack-ios-plugins.sh \
            --official "$OFF_M" --binary out/plugins/agent2api-providers \
            --id agent2api-providers --version "$(python3 -c "import json;print(json.load(open('plugins/agent2api-providers.json'))['version'])")" --out out/packs
          ls -lh out/packs

      # ── 网页提供商：同一套路，只是仓库与 crate 名不同 ──────────────
      - name: 取网页插件源码
        run: |
          set -euo pipefail
          clone_upstream() {
            local repo="$1" dir="$2" depth="${3:-1}"
            for base in "" "https://ghfast.top/" "https://gh-proxy.com/"; do
              rm -rf "$dir"
              if git clone --depth "$depth" "${base}${repo}" "$dir" 2>&1 | tail -2; then
                if [ -d "$dir/.git" ]; then
                  echo "   clone ok: ${base:-直连}"
                  return 0
                fi
              fi
              echo "   clone 失败，换下一个源：${base:-直连}"
            done
            echo "❌ 所有源都克隆失败：$repo"
            return 1
          }
          clone_upstream https://github.com/ProvidersPlugin/Agent2WebProviders.git plugins-web 1
          python3 scripts/patch-plugin-cargo.py plugins-web

      - name: 编网页提供商包
        working-directory: plugins-web
        run: |
          set -euo pipefail
          cargo build -p agent2api-web-providers --release --target aarch64-apple-ios
          mkdir -p "$GITHUB_WORKSPACE/out/plugins"
          cp target/aarch64-apple-ios/release/agent2api-web-providers \
             "$GITHUB_WORKSPACE/out/plugins/agent2api-web-providers"

      - name: 签名（网页包）
        run: |
          ldid -S"$GITHUB_WORKSPACE/agent2api-ios/app/Agent2API/plugin-entitlements.plist" \
            out/plugins/agent2api-web-providers || echo "WARN: ldid 失败"
          file out/plugins/agent2api-web-providers

      - name: 下载网页包骨架 + 打 iOS 网页插件包
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! python3 scripts/fetch-official-packs.py --prefix agent2api-web-providers --out .cache/official --optional; then
            echo "::warning::没取到网页包官方骨架，跳过网页插件包"
            exit 0
          fi
          OFF_W=$(ls .cache/official/agent2api-web-providers-*.zip | head -1)
          bash scripts/pack-ios-plugins.sh \
            --official "$OFF_W" --binary out/plugins/agent2api-web-providers \
            --id agent2api-web-providers --version "$(python3 -c "import json;print(json.load(open('plugins/agent2api-web-providers.json'))['version'])")" --out out/packs
          ls -lh out/packs

      - name: 上传插件产物
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: out/packs/**
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 2. macOS：dmg（Tauri 2，universal）
  # ══════════════════════════════════════════════════════════════════════
  macos:
    name: macOS (dmg)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'macos' }}
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 "$UPSTREAM_REPO" Agent2API
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Agent2API/desktop-tauri/src-tauri -> target
      - run: cargo install tauri-cli --version "^2" --locked
      - name: 打 dmg
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo tauri build --target universal-apple-darwin
      - name: 常驻二进制
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo build -p agent2api-server --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Agent2API/desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            Agent2API/desktop-tauri/src-tauri/target/release/agent2api-server
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 3. Windows：msi + exe
  # ══════════════════════════════════════════════════════════════════════
  windows:
    name: Windows (msi/exe)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'windows' }}
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 $env:UPSTREAM_REPO Agent2API
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Agent2API/desktop-tauri/src-tauri -> target
      - run: cargo install tauri-cli --version "^2" --locked

      # 先把 exe 编出来：这一步失败才是真的编译问题（步骤名直接指出来）
      - name: 编 Windows 可执行（cargo build）
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo build --release -p workbuddy-proxy-desktop

      # 再打安装包。上游 src-tauri/nsis-hooks.nsh 里的 NSIS_HOOK_PREINSTALL 会
      # !insertmacro CheckIfAppIsRunning，而他们的自定义 nsis-template.nsi 没带上
      # RestartManager 那段宏，makensis 直接报
      #   macro named "RestartManager_StartSession" not found
      # （run #155/156 的 Windows 腿就是这么挂的，编译本身是好的）。
      # 绕开它：走 WiX 出 msi，完全不碰他们的 NSIS 模板；失败也无所谓。
      - name: 打安装包（msi，打包尽力而为）
        continue-on-error: true
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo tauri build --bundles msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Agent2API/desktop-tauri/target/release/bundle/msi/*.msi
            Agent2API/desktop-tauri/target/release/bundle/nsis/*.exe
            Agent2API/desktop-tauri/target/release/workbuddy-proxy-desktop.exe
            Agent2API/desktop-tauri/target/release/agent2api.exe
            Agent2API/desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
            Agent2API/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 4. Linux：AppImage + deb + headless 二进制
  # ══════════════════════════════════════════════════════════════════════
  linux:
    name: Linux (AppImage/deb)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'linux' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 "$UPSTREAM_REPO" Agent2API
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential pkg-config file
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Agent2API/desktop-tauri/src-tauri -> target
      - run: cargo install tauri-cli --version "^2" --locked
      - name: 打 AppImage/deb
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo tauri build
      - name: headless 二进制
        working-directory: Agent2API/desktop-tauri/src-tauri
        run: cargo build -p agent2api-server --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Agent2API/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            Agent2API/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            Agent2API/desktop-tauri/src-tauri/target/release/agent2api-server
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 5. Android · KernelSU 模块 zip
  #    输出模块作者编译并真机验证过的原版包（glibc 二进制 + 插件 android-bin）。
  #    用上游源码重编 bionic 二进制的步骤留给 scripts/build-android-ksu.sh
  #    （本地可选执行），CI 不做，避免把 Android 失败耦合进流水线。
  # ══════════════════════════════════════════════════════════════════════
  android-ksu:
    name: Android (KSU zip)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 输出模块包
        run: |
          mkdir -p out/android
          cp assets/agent2api-ksu-module.zip out/android/
          ls -lh out/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-ksu
          path: out/android/**
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 6. Web / Docker：六端里"零壳"的那一端（自托管面板 + PWA）
  # ══════════════════════════════════════════════════════════════════════
  web:
    name: Web (docker + 面板)
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'web' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 "$UPSTREAM_REPO" Agent2API
      - name: 注入宿主能力层到面板
        run: |
          cp agent2api-universal/ui/host.js Agent2API/desktop-tauri/ui/host.js
          for f in Agent2API/desktop-tauri/ui/index.html Agent2API/desktop-tauri/ui/m.html; do
            if [ -f "$f" ] && ! grep -q 'host.js' "$f"; then
              sed -i 's|</head>|  <script src="host.js"></script>\n</head>|' "$f"
            fi
          done
      - name: 打镜像
        run: docker build -t agent2api:ci Agent2API
      - name: 导出
        run: |
          mkdir -p out/web
          docker save agent2api:ci | gzip > out/web/agent2api-image.tar.gz
          tar -C Agent2API/desktop-tauri -czf out/web/agent2api-ui.tar.gz ui
          ls -lh out/web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/web/**
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════════════
  # 7. 发布到 Releases（IPA + daemon + 两个插件 zip，一次点完直接下载）
  #    触发：workflow_dispatch 勾 publish=true（建议 only=store）
  #    发布两个 tag（与插件 manifest 的 tag 规则一致）：
  #      v{version}      → Agent2API.ipa + agent2api-server + plist + 主插件包
  #      web-v{version}  → 网页插件包
  # ══════════════════════════════════════════════════════════════════════
  release:
    name: Publish Release
    needs: [ios, plugins]
    if: ${{ always() && inputs.publish == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 发布说明里要跑 git log，需要完整历史

      - name: 取回构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 归类文件
        run: |
          set -euo pipefail
          mkdir -p dist/app dist/main dist/web

          # 只发布三样东西，避免用户分不清：
          #   ① all-in-one deb（App + 网关 + 面板资源）—— 用户只需装这一个
          #   ② 两个插件 zip —— 由面板内下载，不用手动装
          find artifacts -name '*.deb' -exec cp -v {} dist/app/ \;
          find artifacts -name 'agent2api-providers-*.zip' -exec cp -v {} dist/app/ \;
          find artifacts -name 'agent2api-web-providers-*.zip' -exec cp -v {} dist/app/ \;

          cp dist/app/agent2api-providers-*.zip dist/main/ 2>/dev/null || true
          cp dist/app/agent2api-web-providers-*.zip dist/web/ 2>/dev/null || true

          echo "--- 将发布到快照的资产 ---"; ls -lh dist/app
          test -n "$(ls -A dist/app)" || { echo "dist/app 为空：ios 产物没取到"; exit 1; }

      - name: 读插件版本前先对齐（与 ios/plugins 作业同一规则）
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs "https://github.com/aimod-cc/Agent2API.git" 'v*' \
                | sed 's#.*refs/tags/##' \
                | python3 scripts/latest-tag.py || true)
          python3 scripts/align-plugin-version.py --min-version "${TAG:-v0.0.0}"

      - name: 读取版本号与构建号
        id: ver
        run: |
          set -euo pipefail
          M=$(python3 -c "import json;print(json.load(open('plugins/agent2api-providers.json'))['version'])")
          W=$(python3 -c "import json;print(json.load(open('plugins/agent2api-web-providers.json'))['version'])")
          STAMP=$(date -u +%Y%m%d)
          echo "main=${M}" >> "$GITHUB_OUTPUT"
          echo "web=${W}" >> "$GITHUB_OUTPUT"
          echo "app_tag=ios-${STAMP}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "主包 ${M} / 网页包 ${W} / 应用快照 ios-${STAMP}-b${{ github.run_number }}"

      - name: 生成发布说明
        run: |
          set -euo pipefail
          {
            echo "## 构建信息"
            echo ""
            echo "- 构建号：\`${{ github.run_number }}\`"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- 插件版本：providers \`${{ steps.ver.outputs.main }}\` / web \`${{ steps.ver.outputs.web }}\`"
            echo ""
            echo "## 本次包含"
            echo ""
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| \`Agent2API-standalone.ipa\` | 网关内嵌 + 去沙盒：装完即用，插件可在 App 内执行 |"
            echo "| \`Agent2API.ipa\` | 纯客户端壳：配 LaunchDaemon 使用（0.13 MB） |"
            echo "| \`ios-daemon-kit.zip\` | daemon + plist + 一键安装脚本 |"
            echo "| \`agent2api-providers-*.zip\` | 提供商增强插件（iOS 原生） |"
            echo "| \`agent2api-web-providers-*.zip\` | 网页提供商插件（iOS 原生） |"
            echo ""
            echo "## 最近的提交"
            echo ""
            git log -8 --pretty='- `%h` %s (%an, %ad)' --date=short
          } > notes.md
          cat notes.md

      # ── ① 应用快照：每次构建一个全新 tag，历史版本永久保留（你要的"能看到旧版本"）
      #    注意：这里必须 make_latest: false。网关的插件目录在 stable 通道下走
      #    `/releases/latest`，latest 一旦被 ios-* 快照占住，tag 模板 `v{version}`
      #    解析失败，面板就显示「当前网关平台暂无插件包」（提供商增强永远灰）。
      - name: 发布应用快照（新 tag，保留历史）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.app_tag }}
          name: Agent2API iOS ${{ steps.ver.outputs.main }} · build ${{ github.run_number }}
          body_path: notes.md
          files: dist/app/*
          fail_on_unmatched_files: false
          make_latest: false

      # ── ② 插件稳定通道：tag 固定（网关按 v{版本} 查找），覆盖更新
      #    这里才是 latest：stable 通道的 `/releases/latest` 必须解析到 v{版本}。
      - name: 发布插件稳定通道（providers）
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.main }}
          name: Agent2API providers v${{ steps.ver.outputs.main }}（插件通道）
          body: |
            这是**插件稳定通道**：网关按 `v{版本}` 查这个 tag 来下载插件包。
            每次构建会覆盖资产，历史版本请看 `ios-*` 开头的应用快照。
          files: dist/main/*
          fail_on_unmatched_files: false
          overwrite: true
          make_latest: true

      - name: 发布插件稳定通道（web）
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-v${{ steps.ver.outputs.web }}
          name: Agent2API web-providers v${{ steps.ver.outputs.web }}（插件通道）
          body: |
            网页插件稳定通道（网关据此下载）。历史版本见 `ios-*` 应用快照。
          files: dist/web/*
          fail_on_unmatched_files: false
          overwrite: true
          make_latest: false
